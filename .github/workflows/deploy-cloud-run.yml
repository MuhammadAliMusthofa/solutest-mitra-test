name: Deploy Cloud Run

# Build image Docker (Node.js 24, Next.js standalone) → Artifact Registry → Cloud Run.
# Pola sama dengan fe-solutest; secrets diatur di Settings → Secrets and variables → Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ${{ secrets.GCP_REGION }}-docker.pkg.dev
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REPOSITORY: ${{ secrets.GCP_REPOSITORY }}
  IMAGE_NAME: ${{ secrets.GCP_APP_NAME }}
  SERVICE_NAME: ${{ secrets.GCP_APP_NAME }}
  REGION: ${{ secrets.GCP_REGION }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

jobs:
  deploy:
    name: Build, push & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}" \
            --build-arg NEXT_PUBLIC_MOCK="${{ vars.NEXT_PUBLIC_MOCK || 'false' }}" \
            --build-arg NEXT_PUBLIC_APP_NAME="${{ vars.NEXT_PUBLIC_APP_NAME || 'Solutest Mitra' }}" \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --port=8080
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=10
            --concurrency=80
            --service-account=${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_RUNTIME }}

      - name: Notify Discord
        if: success() && env.DISCORD_WEBHOOK != ''
        run: |
          curl -sS -H "Content-Type: application/json" -X POST \
            -d "{\"content\": \"✅ FE Solutest Mitra ter-deploy oleh ${{ github.actor }}: ${{ steps.deploy.outputs.url }}\"}" \
            "$DISCORD_WEBHOOK"

      - name: Show URL
        run: echo "${{ steps.deploy.outputs.url }}"
